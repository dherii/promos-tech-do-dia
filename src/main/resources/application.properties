# Conexão com o Banco de Dados (Container Docker)
spring.application.name=agregador
spring.datasource.url=jdbc:postgresql://localhost:5432/ofertas_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Hibernate e Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Token do Telegram
telegram.bot.token=${TELEGRAM_BOT_TOKEN}


# Configurações da Shopee
shopee.app-id=${SHOPEE_APP_ID}
shopee.secret=${SHOPEE_SECRET}
shopee.api-base-url=https://open-api.affiliate.shopee.com.br/graphql

# Scanner delay
scanner.fixed-delay-ms=30000
dispatcher.fixed-delay-ms=15000

logging.level.org.springframework.web.reactive.function.client.ExchangeFunctions=TRACE